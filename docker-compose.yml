services:
  ai-trader-v2:
    build: .
    image: krupa-bot:latest
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    command: ["python", "-u", "ai_trader_v2/run_ai_trader.py", "--demo"]
    volumes:
      - krupa-data:/app/data
      - krupa-logs:/app/logs
      - ./config:/app/config
      # Read-only, only so the bot can report which commit is running
      - ./.git:/app/.git:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  krupa-data:
  krupa-logs:
