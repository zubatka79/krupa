x-krupa: &krupa
  build: .
  image: krupa-bot:latest
  restart: unless-stopped
  init: true
  stop_grace_period: 30s
  env_file: .env
  volumes:
    - krupa-data:/app/data
    - krupa-logs:/app/logs
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"

services:
  bot-ada:
    <<: *krupa
    command: ["python", "run_bot.py", "--config", "config_ada.json"]

  bot-wlfi:
    <<: *krupa
    command: ["python", "run_bot.py", "--config", "config_wlfi.json"]

  bot-ltc:
    <<: *krupa
    command: ["python", "run_bot.py", "--config", "config_ltc.json"]

  bot-mnt:
    <<: *krupa
    command: ["python", "run_bot.py", "--config", "config_mnt.json"]

  bot-crv:
    <<: *krupa
    command: ["python", "run_bot.py", "--config", "config_crv.json"]

  bot-hbar:
    <<: *krupa
    command: ["python", "run_bot.py", "--config", "config_hbar.json"]

  watchdog:
    <<: *krupa
    command: ["python", "watchdog.py", "--interval-sec", "150"]
    environment:
      WATCHDOG_SKIP_PROCESS_CHECK: "1"

  supervisor:
    <<: *krupa
    command: ["python", "ai_supervisor.py"]

volumes:
  krupa-data:
  krupa-logs:
