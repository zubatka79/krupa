services:
  vika-n2n7:
    build: .
    image: krupa-vika-n2n7:latest
    container_name: vika-n2n7
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    env_file: .env
    command: ["python", "-u", "ai_trader_v2/run_ai_trader.py", "--demo"]
    volumes:
      - krupa-data:/app/data
      - krupa-logs:/app/logs
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  krupa-data:
  krupa-logs:
